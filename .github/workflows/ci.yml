name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `nix flake check` builds the checks for the runner's own system, so we run it once
    # per target platform: Linux builds the NixOS toplevels, macOS builds the Darwin
    # home activations (incl. the downstream-consumer smoke test). Lint gates
    # (nixfmt/deadnix/statix) run on both — cheap, and keeps a red X visible either way.
    name: flake check (${{ matrix.system }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-latest
            free-disk: true
            kvm: true
          - system: aarch64-darwin
            runs-on: macos-14
            free-disk: false
            kvm: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Building two full NixOS system closures (KDE desktop + home server) can exhaust the
      # ~14 GB free on a stock Linux runner; reclaim space before the Nix store fills.
      - name: Free disk space
        if: matrix.free-disk
        # Pinned to a commit SHA — a mutable @main ref on a third-party action is an
        # unnecessary supply-chain trust grant, even with read-only permissions.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main, 2023-10-18
        with:
          tool-cache: false

      # The craftoria-console NixOS VM test needs /dev/kvm. Hosted Linux runners
      # expose it but not to the runner user's group; open it up before Nix starts so
      # the daemon auto-detects the `kvm` system feature the test derivation requires.
      - name: Enable KVM
        if: matrix.kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      # No --all-systems: each runner checks only its own system (the other platform is
      # covered by the sibling matrix job), so cross-system builds are never attempted.
      - name: Flake check
        run: nix flake check -L --no-write-lock-file --show-trace
